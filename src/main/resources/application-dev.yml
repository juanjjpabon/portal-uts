spring:
  datasource:
    # PostgreSQL 18 local, ya instalado. Ajusta el nombre de BD si usas otro.
    url: jdbc:postgresql://localhost:5432/portal_uts
    username: postgres
    # La contrasena NO se escribe aqui. Definela como variable de entorno DB_PASSWORD
    # antes de arrancar la app. Si prefieres un archivo local ignorado por git,
    # crea application-dev.local.yml con spring.datasource.password y activalo con
    # --spring.profiles.active=dev,dev-local
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true
  # Comodidad de desarrollo local (recargar plantillas/estaticos sin reiniciar).
  # Antes estaba en application.yml y por eso tambien aplicaba en Render, donde
  # solo cuesta memoria/CPU sin ningun beneficio (nadie edita plantillas ahi en caliente).
  thymeleaf:
    cache: false
  web:
    resources:
      cache:
        period: 0

logging:
  level:
    org.hibernate.SQL: DEBUG
