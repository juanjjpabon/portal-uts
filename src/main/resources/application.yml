spring:
  application:
    name: portal-uts
  profiles:
    active: dev
  # Datasource generico, por variables de entorno independientes (host, puerto,
  # nombre de base, usuario, contrasena). Se usa cuando el perfil "dev" NO esta
  # activo (p. ej. despliegue), ya que application-dev.yml define los valores
  # fijos de desarrollo local y los sobreescribe cuando "dev" si esta activo.
  # En Render, DatabaseUrlEnvironmentPostProcessor arma esta URL solo a partir
  # de la variable DATABASE_URL, sin necesitar host/puerto sueltos.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portal_uts}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  thymeleaf:
    cache: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  web:
    resources:
      cache:
        period: 0

server:
  # Render (y la mayoria de plataformas de hosting) asignan el puerto propio
  # por la variable de entorno PORT; en local, sin esa variable, sigue siendo 8080.
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false
    # HU-26: nunca exponer detalle tecnico en la respuesta al usuario, sin importar
    # el perfil. El detalle completo va solo al log interno (PortalErrorAttributes).
    include-exception: false
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

portal:
  seguridad:
    # Se crea SOLO si la tabla usuario esta vacia al arrancar.
    # La contrasena NO va en el codigo: se toma de la variable de entorno
    # PORTAL_ADMIN_INICIAL_PASSWORD. Si no esta definida, no se crea el usuario.
    admin-inicial:
      correo: admin.tecnico@uts.edu.co
      nombre: Administrador Tecnico
      password: ${PORTAL_ADMIN_INICIAL_PASSWORD:}

logging:
  level:
    org.springframework.security: INFO
    co.edu.uts.portal: DEBUG
