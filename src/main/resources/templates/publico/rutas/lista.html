<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Rutas institucionales')}"></head>
<body>

<nav th:replace="~{fragments/comunes :: navbarPublico}"></nav>
<header th:replace="~{fragments/comunes :: encabezado('Rutas institucionales', 'Qué hacer, paso a paso, y a quién acudir dentro de la institución.')}"></header>

<main class="container py-5 con-encabezado" style="max-width: 820px;">
    <div class="alert alert-success py-2" th:if="${gracias}">¡Gracias por tu opinión!</div>

    <div th:if="${rutas.isEmpty()}" class="alert alert-info">Aún no hay rutas publicadas.</div>
    <th:block th:each="r : ${rutas}">
        <article th:replace="~{fragments/tarjetas :: tarjetaRuta(${r}, ${pasosPorRuta.get(r.id)})}"></article>
    </th:block>

    <h2 class="h4 mt-5 mb-3">Otros contactos</h2>
    <div th:if="${contactos.isEmpty()}" class="alert alert-light border">Aún no hay contactos publicados.</div>
    <th:block th:each="r : ${contactos}">
        <article th:replace="~{fragments/tarjetas :: tarjetaRuta(${r}, null)}"></article>
    </th:block>

    <div class="aviso-urgencia mt-4">
        <svg th:replace="~{fragments/iconos :: icono('alerta')}"></svg>
        <p class="mb-0">¿Es una situación urgente?
            <a th:href="@{/urgencia}">Ver información urgente &rarr;</a></p>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
