<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Buscar')}"></head>
<body>

<nav th:replace="~{fragments/comunes :: navbarPublico}"></nav>

<main class="container py-5" style="max-width: 780px;">
    <h1 class="h2">Resultados de búsqueda</h1>
    <p class="text-muted" th:if="${q != null and !q.isBlank()}">
        <span th:text="${total}">0</span> resultado(s) para "<span th:text="${q}"></span>"
    </p>

    <div th:if="${q == null or q.isBlank()}" class="alert alert-info">
        Escribe una palabra clave para buscar.
    </div>
    <div th:if="${q != null and !q.isBlank() and total == 0}" class="alert alert-warning">
        No se encontraron resultados para "<span th:text="${q}"></span>".
    </div>

    <div th:each="grupo : ${resultados}">
        <h2 class="h4 mt-4" th:text="${grupo.key.etiquetaPlural}">Grupo</h2>
        <div th:if="${grupo.key.name() == 'CONTENIDO'}" class="row g-3">
            <div class="col-sm-6 col-lg-4" th:each="r : ${grupo.value}">
                <article th:replace="~{fragments/tarjetas :: tarjetaContenido(${r})}"></article>
            </div>
        </div>
        <div th:unless="${grupo.key.name() == 'CONTENIDO'}">
            <th:block th:each="r : ${grupo.value}">
                <article th:replace="~{fragments/tarjetas :: tarjetaRuta(${r}, null)}"></article>
            </th:block>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
