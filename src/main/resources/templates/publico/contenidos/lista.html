<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Contenidos')}"></head>
<body>

<nav th:replace="~{fragments/comunes :: navbarPublico}"></nav>
<header th:replace="~{fragments/comunes :: encabezado('Contenidos', 'Información preventiva sobre salud mental y bienestar.')}"></header>

<main class="container py-5 con-encabezado">
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-sm rounded-pill" th:classappend="${categoriaActiva == null} ? 'btn-primary' : 'btn-outline-secondary'"
           th:href="@{/contenidos}">Todas</a>
        <a class="btn btn-sm rounded-pill" th:each="c : ${categorias}"
           th:classappend="${c.slug == categoriaActiva} ? 'btn-primary' : 'btn-outline-secondary'"
           th:href="@{/contenidos(categoria=${c.slug})}" th:text="${c.nombre}">Categoría</a>
    </div>

    <div th:if="${contenidos.isEmpty()}" class="alert alert-info">
        No hay contenidos publicados en esta categoría todavía.
    </div>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-4" th:each="r : ${contenidos}">
            <article th:replace="~{fragments/tarjetas :: tarjetaContenido(${r})}"></article>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
