<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Error del sistema')}"></head>
<body>

<nav th:replace="~{fragments/comunes :: navbarPublico}"></nav>

<main class="container py-5 text-center">
    <h1 class="display-6">Ocurrió un error</h1>
    <p class="text-muted">
        No pudimos completar la operación. El detalle técnico quedó registrado de forma
        segura (HU-26); intenta de nuevo más tarde.
    </p>
    <p class="text-muted small" th:if="${referencia}">
        Si el problema persiste, indica este código al soporte: <code th:text="${referencia}">ref</code>
    </p>
    <a class="btn btn-outline-primary" th:href="@{/}">Ir al inicio</a>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
</body>
</html>
