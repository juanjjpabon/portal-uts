<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Cuestionarios')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/comunes :: navbarAdmin}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">Cuestionarios</h1>
        <a class="btn btn-primary" th:href="@{/admin/cuestionarios/nuevo}">Nuevo cuestionario</a>
    </div>

    <div th:replace="~{fragments/comunes :: alerts}"></div>

    <div class="table-responsive mt-3">
        <table class="table table-hover align-middle bg-white">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Version publicada</th>
                <th>Versiones</th>
                <th>Activo</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${cuestionarios.isEmpty()}">
                <td colspan="5" class="text-center text-muted py-4">Aun no hay cuestionarios.</td>
            </tr>
            <tr th:each="c : ${cuestionarios}">
                <td>
                    <a th:href="@{|/admin/cuestionarios/${c.id}|}" th:text="${c.nombre}">Nombre</a>
                    <div class="small text-muted" th:text="${c.descripcion}"></div>
                </td>
                <td>
                    <span th:if="${c.versionPublicada().isPresent()}" class="badge text-bg-success"
                          th:text="|v${c.versionPublicada().get().numero}|">v1</span>
                    <span th:unless="${c.versionPublicada().isPresent()}" class="text-muted">—</span>
                </td>
                <td th:text="${c.versiones.size()}">0</td>
                <td>
                    <span class="badge" th:classappend="${c.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${c.activo} ? 'Si' : 'No'"></span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{|/admin/cuestionarios/${c.id}/editar|}">Datos</a>
                    <a class="btn btn-sm btn-outline-primary" th:href="@{|/admin/cuestionarios/${c.id}|}">Versiones</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
