<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head(${usuario.nombreCompleto})}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/comunes :: navbarAdmin}"></nav>

<main class="container py-4" style="max-width: 780px;"
      th:with="base=@{|/admin/usuarios/${usuario.id}|}">

    <p class="mb-1"><a th:href="@{/admin/usuarios}">&larr; Usuarios</a></p>
    <div class="d-flex justify-content-between align-items-start">
        <div>
            <h1 class="h3 mb-1" th:text="${usuario.nombreCompleto}">Nombre</h1>
            <p class="text-muted mb-0" th:text="${usuario.correo}">correo</p>
        </div>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{|${base}/editar|}">Editar datos</a>
    </div>

    <div th:replace="~{fragments/comunes :: alerts}"></div>

    <div class="row g-3 mt-1">
        <!-- Roles -->
        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <h2 class="h6">Roles</h2>
                <form method="post" th:action="@{|${base}/roles|}">
                    <div class="form-check" th:each="r : ${todosLosRoles}">
                        <input type="checkbox" class="form-check-input" name="roles" th:value="${r}"
                               th:id="${'r-' + r}" th:checked="${rolesUsuario.contains(r.name())}">
                        <label class="form-check-label" th:for="${'r-' + r}" th:text="${r.etiqueta}">rol</label>
                    </div>
                    <button class="btn btn-sm btn-primary mt-2">Guardar roles</button>
                </form>
            </div></div>
        </div>

        <!-- Estado -->
        <div class="col-md-6">
            <div class="card h-100"><div class="card-body">
                <h2 class="h6">Estado de la cuenta</h2>
                <p class="mb-2">
                    <span class="badge" th:classappend="${usuario.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${usuario.activo} ? 'Activa' : 'Inactiva'"></span>
                </p>
                <form method="post" th:if="${usuario.activo}" th:action="@{|${base}/desactivar|}">
                    <button class="btn btn-sm btn-outline-warning" th:disabled="${esUsuarioActual}">Desactivar</button>
                </form>
                <form method="post" th:unless="${usuario.activo}" th:action="@{|${base}/activar|}">
                    <button class="btn btn-sm btn-outline-success">Activar</button>
                </form>
                <p class="small text-muted mt-2 mb-0" th:if="${esUsuarioActual}">Es tu propia cuenta.</p>
            </div></div>
        </div>

        <!-- Contrasena -->
        <div class="col-12">
            <div class="card"><div class="card-body">
                <h2 class="h6">Restablecer contrasena</h2>
                <form method="post" th:action="@{|${base}/contrasena|}" class="d-flex gap-2 align-items-start"
                      style="max-width: 420px;">
                    <input type="text" class="form-control form-control-sm" name="contrasena"
                           placeholder="Nueva contrasena (min. 8)" minlength="8" required>
                    <button class="btn btn-sm btn-outline-danger">Restablecer</button>
                </form>
                <p class="small text-muted mt-1 mb-0">
                    Se marca para cambio obligatorio en el proximo ingreso del usuario.
                </p>
            </div></div>
        </div>
    </div>

    <!-- Historial de bitacora del usuario (HU-22) -->
    <h2 class="h5 mt-4">Historial de cambios</h2>
    <div class="table-responsive">
        <table class="table table-sm bg-white">
            <thead><tr><th>Fecha</th><th>Actor</th><th>Accion</th><th>Descripcion</th></tr></thead>
            <tbody>
            <tr th:if="${historial.isEmpty()}"><td colspan="4" class="text-muted text-center py-3">Sin registros.</td></tr>
            <tr th:each="h : ${historial}">
                <td class="small text-nowrap"
                    th:text="${#temporals.format(h.ocurridoEn, 'dd/MM/yyyy HH:mm', 'America/Bogota')}">fecha</td>
                <td class="small" th:text="${h.actor}">actor</td>
                <td class="small" th:text="${h.accion.etiqueta}">accion</td>
                <td class="small" th:text="${h.descripcion}">descripcion</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
