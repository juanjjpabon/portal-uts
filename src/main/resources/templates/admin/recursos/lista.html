<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/comunes :: head(${tipo.etiquetaPlural})}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/comunes :: navbarAdmin}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0" th:text="${tipo.etiquetaPlural}">Recursos</h1>
        <a class="btn btn-primary" th:href="@{|/admin/recursos/${seccion}/nuevo|}"
           th:text="|Nuevo: ${tipo.etiquetaSingular}|">Nuevo</a>
    </div>

    <div th:replace="~{fragments/comunes :: alerts}"></div>

    <form class="row g-2 my-3" method="get" th:action="@{|/admin/recursos/${seccion}|}">
        <div class="col-sm-3">
            <select name="estado" class="form-select">
                <option value="">Todos los estados</option>
                <option th:each="e : ${estados}" th:value="${e}" th:text="${e.etiqueta}"
                        th:selected="${e == filtroEstado}"></option>
            </select>
        </div>
        <div class="col-sm-3">
            <select name="categoria" class="form-select">
                <option value="">Todas las categorías</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                        th:selected="${c.id == filtroCategoria}"></option>
            </select>
        </div>
        <div class="col-sm-4">
            <input type="text" name="q" class="form-control" placeholder="Buscar por título o dependencia"
                   th:value="${filtroTexto}">
        </div>
        <div class="col-sm-2 d-grid">
            <button class="btn btn-outline-secondary" type="submit">Filtrar</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white">
            <thead>
            <tr>
                <th class="columna-miniatura"><span class="visually-hidden">Imagen</span></th>
                <th>Título</th>
                <th th:if="${tipo.esContenido()}">Categorías</th>
                <th th:unless="${tipo.esContenido()}">Dependencia</th>
                <th th:unless="${tipo.esContenido()}">Canal</th>
                <th th:unless="${tipo.esContenido()}">Urgente</th>
                <th th:if="${tipo.name() == 'RUTA'}">Pasos</th>
                <th>Estado</th>
                <th>Actualizado</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${recursos.isEmpty()}">
                <td colspan="9" class="text-center text-muted py-4">Sin registros.</td>
            </tr>
            <tr th:each="r : ${recursos}">
                <td class="columna-miniatura">
                    <img th:if="${r.tieneImagen}" th:src="@{|/imagenes/${r.imagenId}|}" alt="" class="miniatura-lista">
                </td>
                <td>
                    <span th:text="${r.titulo}">Título</span>
                    <span th:if="${r.destacado}" class="badge text-bg-warning ms-1" title="Aparece en el carrusel de la portada">Destacado</span>
                </td>
                <td th:if="${tipo.esContenido()}">
                    <span class="badge text-bg-light me-1" th:each="c : ${r.categorias}" th:text="${c.nombre}"></span>
                </td>
                <td th:unless="${tipo.esContenido()}" th:text="${r.dependencia}">Dependencia</td>
                <td th:unless="${tipo.esContenido()}" th:text="${r.canal}">Canal</td>
                <td th:unless="${tipo.esContenido()}">
                    <span th:if="${r.urgente}" class="badge text-bg-danger">Urgente</span>
                </td>
                <td th:if="${tipo.name() == 'RUTA'}">
                    <th:block th:with="n=${conteoPasos.get(r.id) != null ? conteoPasos.get(r.id) : 0}">
                        <span th:if="${n == 0}" class="badge text-bg-light border" title="Esta ruta aún no dice qué pasos seguir">Sin pasos</span>
                        <span th:unless="${n == 0}" class="badge text-bg-primary" th:text="|${n} pasos|">3 pasos</span>
                    </th:block>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${r.estado.name() == 'PUBLICADO'} ? 'text-bg-success'
                                        : (${r.estado.name() == 'BORRADOR'} ? 'text-bg-secondary' : 'text-bg-warning')"
                          th:text="${r.estado.etiqueta}">Estado</span>
                </td>
                <td class="small text-muted"
                    th:text="${r.actualizadoEn != null}
                             ? ${#temporals.format(r.actualizadoEn, 'dd/MM/yyyy HH:mm', 'America/Bogota')}
                             : '-'">-</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{|/admin/recursos/${seccion}/${r.id}/editar|}">Editar</a>
                    <a th:if="${tipo.name() == 'RUTA'}" class="btn btn-sm btn-primary"
                       th:href="@{|/admin/recursos/rutas/${r.id}/pasos|}">Pasos</a>
                    <form class="d-inline" method="post"
                          th:if="${r.estado.name() != 'PUBLICADO'}"
                          th:action="@{|/admin/recursos/${seccion}/${r.id}/publicar|}"
                          th:with="sinPasos=${tipo.name() == 'RUTA' and (conteoPasos.get(r.id) == null or conteoPasos.get(r.id) == 0)}">
                        <button class="btn btn-sm btn-outline-success" th:disabled="${sinPasos}"
                                th:title="${sinPasos} ? 'Agrega al menos un paso antes de publicar' : null">Publicar</button>
                    </form>
                    <form class="d-inline" method="post"
                          th:if="${r.estado.name() == 'PUBLICADO'}"
                          th:action="@{|/admin/recursos/${seccion}/${r.id}/archivar|}">
                        <button class="btn btn-sm btn-outline-warning">Archivar</button>
                    </form>
                    <form class="d-inline" method="post"
                          th:action="@{|/admin/recursos/${seccion}/${r.id}/eliminar|}"
                          onsubmit="return confirm('Eliminar este registro de forma definitiva?')">
                        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
