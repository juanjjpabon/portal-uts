<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Categorías')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/comunes :: navbarAdmin}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">Categorías</h1>
        <a class="btn btn-primary" th:href="@{/admin/categorias/nueva}">Nueva categoría</a>
    </div>

    <div th:replace="~{fragments/comunes :: alerts}"></div>

    <div class="table-responsive mt-3">
        <table class="table table-hover align-middle bg-white">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Recursos</th>
                <th>Activa</th>
                <th>Orden</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${categorias.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-4">Sin categorías.</td>
            </tr>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.nombre}">Nombre</td>
                <td class="small text-muted" th:text="${c.descripcion}">-</td>
                <td th:text="${conteos[c.id]}">0</td>
                <td>
                    <span class="badge" th:classappend="${c.activa} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${c.activa} ? 'Sí' : 'No'"></span>
                </td>
                <td th:text="${c.orden}">0</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{|/admin/categorias/${c.id}/editar|}">Editar</a>
                    <form class="d-inline" method="post" th:action="@{|/admin/categorias/${c.id}/eliminar|}"
                          onsubmit="return confirm('Eliminar esta categoría?')">
                        <button class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p class="text-muted small">Una categoría con recursos asociados no se puede eliminar; desactívala para ocultarla del portal.</p>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
