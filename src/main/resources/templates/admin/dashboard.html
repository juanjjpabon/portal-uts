<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/comunes :: head('Panel')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/comunes :: navbarAdmin}"></nav>

<main class="container py-4">
    <h1 class="h3">Panel administrativo</h1>
    <p class="text-muted">
        Sesion iniciada como <strong sec:authentication="name">correo</strong>.
    </p>

    <div class="row g-3 mt-2">
        <div class="col-md-4" sec:authorize="hasRole('ADMIN_FUNCIONAL')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Gestion de contenido</h2>
                    <ul class="small mb-0 ps-3">
                        <li><a th:href="@{/admin/recursos/contenidos}">Contenidos</a></li>
                        <li><a th:href="@{/admin/recursos/rutas}">Rutas institucionales</a></li>
                        <li><a th:href="@{/admin/recursos/contactos}">Contactos</a></li>
                        <li><a th:href="@{/admin/categorias}">Categorias</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('ADMIN_TECNICO')">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5">Administracion tecnica</h2>
                    <p class="small text-muted mb-0">
                        Usuarios y roles, bitacora de cambios y configuracion del sistema.
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/comunes :: footer}"></footer>
<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
