<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/comunes :: head('Ingresar')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments/comunes :: navbarPublico}"></nav>

<main class="container" style="max-width: 420px;">
    <div class="card shadow-sm mt-5">
        <div class="card-body p-4">
            <h1 class="h4 mb-3">Iniciar sesion</h1>

            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
                Correo o contrasena incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
                Tu sesion se cerro correctamente.
            </div>
            <div th:if="${param.clave}" class="alert alert-success py-2" role="alert">
                Contrasena actualizada. Ingresa de nuevo.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo institucional</label>
                    <input type="email" id="correo" name="correo" class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="clave" class="form-label">Contrasena</label>
                    <input type="password" id="clave" name="clave" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
    <p class="text-center mt-3">
        <a th:href="@{/}">Volver al portal</a>
    </p>
</main>

<th:block th:replace="~{fragments/comunes :: scripts}"></th:block>
</body>
</html>
