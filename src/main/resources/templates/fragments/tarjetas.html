<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Tarjeta de un CONTENIDO publicado (HU-01/HU-02/HU-04). -->
<div th:fragment="tarjetaContenido(r)" class="card h-100">
    <div class="card-body d-flex flex-column">
        <h3 class="h5"><a th:href="@{|/contenidos/${r.slug}|}" th:text="${r.titulo}">Titulo</a></h3>
        <p class="text-muted small flex-grow-1" th:text="${r.resumen}">Resumen</p>
        <div>
            <span class="badge text-bg-light me-1" th:each="c : ${r.categorias}" th:text="${c.nombre}"></span>
        </div>
        <p class="text-muted small mb-0 mt-2"
           th:if="${r.actualizadoEn != null}"
           th:text="'Actualizado el ' + ${#temporals.format(r.actualizadoEn, 'dd/MM/yyyy', 'America/Bogota')}">
            Actualizado
        </p>
    </div>
</div>

<!-- Tarjeta de una RUTA o CONTACTO publicado (HU-05/HU-06/HU-07). -->
<div th:fragment="tarjetaRuta(r)" class="card mb-2">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
            <h3 class="h6 mb-1" th:text="${r.titulo}">Titulo</h3>
            <span th:if="${r.urgente}" class="badge text-bg-danger">Urgente</span>
        </div>
        <p class="small mb-1">
            <strong>Dependencia:</strong> <span th:text="${r.dependencia}"></span><br>
            <span th:if="${r.horario}"><strong>Horario:</strong> <span th:text="${r.horario}"></span><br></span>
            <strong>Canal:</strong> <span th:text="${r.canal}"></span>
        </p>
        <p class="text-muted small mb-2" th:if="${r.actualizadoEn != null}"
           th:text="'Ultima revision: ' + ${#temporals.format(r.actualizadoEn, 'dd/MM/yyyy', 'America/Bogota')}">
            Ultima revision
        </p>
        <a th:if="${r.urlCanal}" class="btn btn-sm btn-outline-primary" th:href="${r.urlCanal}"
           target="_blank" rel="noopener">Abrir canal</a>
    </div>
</div>

</body>
</html>
