<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Iconos SVG propios, sin CDN de iconos (mismo criterio que el ojo de mostrar
     contraseña en comunes.html). Uso: th:replace="~{fragments/iconos :: icono('correo')}".
     Son decorativos (aria-hidden): el texto que los acompaña es el que se lee. -->
<svg th:fragment="icono(nombre)" class="icono" width="20" height="20" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
    <th:block th:switch="${nombre}">
        <th:block th:case="'correo'">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m3 7 9 6 9-6"></path>
        </th:block>
        <th:block th:case="'telefono'">
            <rect x="7" y="2" width="10" height="20" rx="2"></rect>
            <path d="M11 18h2"></path>
        </th:block>
        <th:block th:case="'chat'">
            <path d="M21 12a8 8 0 0 1-11.8 7.03L4 20l1.1-4.6A8 8 0 1 1 21 12Z"></path>
        </th:block>
        <th:block th:case="'web'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18Z"></path>
        </th:block>
        <th:block th:case="'copiar'">
            <rect x="9" y="9" width="12" height="12" rx="2"></rect>
            <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
        </th:block>
        <th:block th:case="'externo'">
            <path d="M14 4h6v6"></path>
            <path d="M20 4 10 14"></path>
            <path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path>
        </th:block>
        <th:block th:case="'reloj'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
        </th:block>
        <th:block th:case="'edificio'">
            <rect x="4" y="3" width="16" height="18" rx="1"></rect>
            <path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"></path>
            <path d="M10 21v-3h4v3"></path>
        </th:block>
        <th:block th:case="'libro'">
            <path d="M3 5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v16a2 2 0 0 0-2-2H3Z"></path>
            <path d="M21 5a2 2 0 0 0-2-2h-5a2 2 0 0 0-2 2v16a2 2 0 0 1 2-2h7Z"></path>
        </th:block>
        <th:block th:case="'brujula'">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m15.5 8.5-2 5-5 2 2-5Z"></path>
        </th:block>
        <th:block th:case="'corazon'">
            <path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20Z"></path>
        </th:block>
        <th:block th:case="'alerta'">
            <path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"></path>
            <path d="M12 9v4M12 17h.01"></path>
        </th:block>
        <th:block th:case="'pasos'">
            <path d="M10 6h11M10 12h11M10 18h11"></path>
            <path d="M4 6h1M4 12h1M4 18h1"></path>
        </th:block>
        <th:block th:case="'imagen'">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <circle cx="9" cy="10" r="2"></circle>
            <path d="m21 16-5-5-9 9"></path>
        </th:block>
        <th:block th:case="'estrella'">
            <path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"></path>
        </th:block>
        <th:block th:case="'flecha'">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
        </th:block>
        <th:block th:case="'arriba'">
            <path d="M12 19V5M6 11l6-6 6 6"></path>
        </th:block>
        <th:block th:case="'abajo'">
            <path d="M12 5v14M6 13l6 6 6-6"></path>
        </th:block>
        <th:block th:case="'lapiz'">
            <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z"></path>
        </th:block>
        <th:block th:case="'basura'">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path>
        </th:block>
        <th:block th:case="'mas'">
            <path d="M12 5v14M5 12h14"></path>
        </th:block>
        <th:block th:case="'check'">
            <path d="m5 12 5 5L20 7"></path>
        </th:block>
    </th:block>
</svg>
</body>
</html>
